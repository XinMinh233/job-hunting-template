{% extends "base.html" %}
{% block title %}修改密码 · {{ app_name }}{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block body %}
<main class="auth-shell compact">
  <section class="auth-intro">
    <div class="brand-mark">JH</div>
    <p class="eyebrow">FIRST SIGN-IN</p>
    <h1>先换一把<br>只有你知道的钥匙。</h1>
    <p>临时密码只能用于首次进入。新密码至少 12 个字符。</p>
  </section>
  <section class="auth-card">
    <div>
      <p class="eyebrow">账号安全</p>
      <h2>设置新密码</h2>
    </div>
    <form id="password-form" class="stack">
      <label>当前临时密码<input name="current_password" type="password" required></label>
      <label>新密码<input name="new_password" type="password" minlength="12" required></label>
      <label>确认新密码<input name="confirmation" type="password" minlength="12" required></label>
      <p id="password-error" class="form-error" hidden></p>
      <button class="primary" type="submit">保存并继续</button>
    </form>
  </section>
</main>
{% endblock %}
{% block scripts %}<script src="/static/auth.js"></script>{% endblock %}
