[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunt-web"
version = "0.1.0"
description = "面向小规模可信用户的求职系统 Web 外壳"
readme = "docs/web/README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "jinja2>=3.1,<4",
  "httpx>=0.27,<1",
  "argon2-cffi>=23.1,<26",
  "python-multipart>=0.0.12,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[project.scripts]
jobhunt-web = "webapp.main:run"
jobhunt-runner = "webapp.runner_server:run"
jobhunt-admin = "webapp.cli:main"

[tool.setuptools.packages.find]
include = ["webapp*"]

[tool.setuptools.package-data]
webapp = ["templates/*.html", "static/*"]
"webapp.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
